name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: File length gate (<=100 lines per logic .kt)
        run: node scripts/check-file-lines.mjs

      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug

      - name: Unit tests + coverage report
        run: ./gradlew testDebugUnitTest jacocoTestReport

      - name: Coverage floor (>=80% line)
        run: ./gradlew jacocoCoverageVerification

      - name: CRAP gate (<=15 per method)
        run: node scripts/crap-check.mjs

      - name: Halstead gate (D <= 20 per function)
        run: node scripts/check-halstead.mjs

      - name: Duplication gate (jscpd, threshold 0)
        run: npx -y jscpd app/src

      - name: e2e feature coverage mapping
        run: node scripts/check-feature-coverage.mjs

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/

  acceptance:
    name: Acceptance (${{ matrix.feature }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per e2e feature area. scripts/check-feature-coverage.mjs
        # enforces that every e2e/features/**/*.feature file is listed here.
        feature: [placeholder]
    steps:
      - uses: actions/checkout@v4

      # Placeholder until the first .feature lands. The real job will:
      # - uses: actions/setup-java@v4            (JDK 17, corretto)
      # - uses: android-actions/setup-android@v3
      # - name: Enable KVM
      #   run: |
      #     echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
      #       | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      #     sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # - uses: reactivecircus/android-emulator-runner@v2
