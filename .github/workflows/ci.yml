name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: File length gate (<=100 lines per logic .kt)
        run: node scripts/check-file-lines.mjs

      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug

      - name: Unit tests + coverage report
        run: ./gradlew testDebugUnitTest jacocoTestReport

      - name: Coverage floor (>=80% line)
        run: ./gradlew jacocoCoverageVerification

      - name: CRAP gate (<=15 per method)
        run: node scripts/crap-check.mjs

      - name: Halstead gate (D <= 20 per function)
        run: node scripts/check-halstead.mjs

      - name: Duplication gate (jscpd, threshold 0)
        run: npx -y jscpd app/src

      - name: e2e feature coverage mapping
        run: node scripts/check-feature-coverage.mjs

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/

  acceptance:
    name: Acceptance (${{ matrix.feature }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One entry per e2e feature area (cucumber tag = @<feature>).
        # scripts/check-feature-coverage.mjs enforces that every
        # e2e/features/**/*.feature file is listed here.
        feature: [add-playlist, epg-data, watch-and-zap, channel-panel, settings, tv-guide, search, recording]
    # Emulator image: android-tv system images only ship x86_64 for API 36
    # (API 34 TV is 32-bit x86 / arm64 only — verified via sdkmanager), so
    # the acceptance suite runs on the API 36 TV image, matching targetSdk.
    env:
      TV_API_LEVEL: 36
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-tv-36-${{ matrix.feature }}
          restore-keys: |
            avd-tv-36-

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Gherkin acceptance (@${{ matrix.feature }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # NOTE: the runner action executes each script line as its own
          # command — keep this a single line (no shell continuations).
          script: bash scripts/ci-acceptance.sh ${{ matrix.feature }}

      - name: Upload acceptance artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.feature }}
          path: |
            artifacts/
            app/build/reports/androidTests/
          if-no-files-found: ignore
