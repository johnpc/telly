name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gates
    # Self-hosted Mac Mini. This job also runs on pull_request, and
    # self-hosted runners on a public repo are unsafe for fork PRs
    # (arbitrary code execution) — so only run for push-to-main or a PR
    # authored by the repo owner. Other PRs simply skip this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: File length gate (<=100 lines per logic .kt)
        run: node scripts/check-file-lines.mjs

      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug

      - name: Unit tests + coverage report
        run: ./gradlew testDebugUnitTest jacocoTestReport

      - name: Coverage floor (>=80% line)
        run: ./gradlew jacocoCoverageVerification

      - name: CRAP gate (<=15 per method)
        run: node scripts/crap-check.mjs

      - name: Halstead gate (D <= 20 per function)
        run: node scripts/check-halstead.mjs

      - name: Duplication gate (jscpd, threshold 0)
        run: npx -y jscpd app/src

      - name: e2e feature coverage mapping
        run: node scripts/check-feature-coverage.mjs

      - name: State-machine catalog (owners + tests exist)
        run: node scripts/check-state-machines.mjs

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/

  acceptance:
    name: Acceptance (${{ matrix.feature }})
    needs: quality
    # Self-hosted Mac Mini, one leg at a time on its Android TV emulator
    # (API 36 arm64 under Hypervisor.framework; 1–6 min per leg). The
    # GitHub-hosted emulator path failed in its own AVD-snapshot/boot steps
    # often enough (16 of 40 runs in Nov 2026) that "no flaky tests" was
    # unreachable there; here the same 13 legs ran 165/165 green.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # One entry per e2e feature area (cucumber tag = @<feature>).
        # scripts/check-feature-coverage.mjs enforces that every
        # e2e/features/**/*.feature file is listed here.
        feature: [add-playlist, epg-data, watch-and-zap, channel-panel, settings, tv-guide, search, reminders, my-list, vod, recording, block-channel, catch-up]
    env:
      TV_AVD: telly-tv36
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Boot the Android TV emulator
        run: |
          bash scripts/emulator.sh stop
          bash scripts/emulator.sh ensure-avd "$TV_AVD"
          bash scripts/emulator.sh start "$TV_AVD"

      - name: Run Gherkin acceptance (@${{ matrix.feature }})
        run: bash scripts/ci-acceptance.sh ${{ matrix.feature }}

      - name: Stop the emulator
        if: always()
        run: bash scripts/emulator.sh stop

      - name: Upload acceptance artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.feature }}
          path: |
            artifacts/
            app/build/reports/androidTests/
          if-no-files-found: ignore
