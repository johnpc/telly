name: Android Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Publish APK to GitHub Release
    if: github.event.workflow_run.conclusion == 'success'
    # Self-hosted Mac Mini. Safe here: only triggers on workflow_run
    # (post-merge, after CI succeeds) — never on pull_request.
    runs-on: [self-hosted, mac-mini]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # Android refuses to install unsigned APKs ("invalid package"), so fail
      # loudly rather than publish one.
      - name: Decode release keystore
        env:
          TELLY_KEYSTORE_BASE64: ${{ secrets.TELLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TELLY_KEYSTORE_BASE64" ]; then
            echo "::error::TELLY_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned APK"
            exit 1
          fi
          echo "$TELLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/telly-release.jks"
          echo "TELLY_KEYSTORE_PATH=$RUNNER_TEMP/telly-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          TELLY_KEYSTORE_PASSWORD: ${{ secrets.TELLY_KEYSTORE_PASSWORD }}
          TELLY_KEY_ALIAS: ${{ secrets.TELLY_KEY_ALIAS }}
          TELLY_KEY_PASSWORD: ${{ secrets.TELLY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/telly-release.jks"

      - name: Read versionName
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/telly-v${{ steps.version.outputs.version }}-${{ github.run_number }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: telly v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: dist/*.apk
